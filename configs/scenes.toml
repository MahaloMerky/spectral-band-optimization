# Scene list for scripts/download_data.py and scripts/build_pixel_table.py.
# Relative paths are resolved from this file's folder. data/raw is a junction to
# D:/bandopt-data/raw on the workstation used so far (C: is nearly full).

solar_spectrum = "../data/raw/solar/hybrid_reference_spectrum_p1nm_resolution_c2022-11-30_with_unc.nc"
worldcover_tiles = ["../data/raw/worldcover/*.tif"]

# Built-in WorldCover mapping: 10 tree cover and 30 grassland -> vegetation,
# 50 built-up -> urban, 60 bare/sparse -> bare_soil, 80 permanent water -> water.
# Desert scenes below map 60 to sand instead.
[worldcover_classes]

# Namib Sand Sea, Namibia, 2023-01-13, 0% cloud
[[scene]]
id = "namib_sand"
site = "Namib Sand Sea, Namibia"
date = "2023-01-13"
cloud_cover = 0
role = "surface"
radiance = "../data/raw/emit/EMIT_L1B_RAD_001_20230113T145839_2301309_011.nc"
observation = "../data/raw/emit/EMIT_L1B_OBS_001_20230113T145839_2301309_011.nc"
mask = "../data/raw/emit/EMIT_L2A_MASK_001_20230113T145839_2301309_011.nc"
[scene.worldcover_classes]
60 = "sand"

