name: bandopt
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - numpy
  # OpenBLAS, not MKL: conda-forge's MKL DLLs clash with the ones bundled in the
  # pip PyTorch wheel on Windows, and `import torch` then fails (WinError 127).
  - libblas=*=*openblas
  - scipy
  - pandas
  - scikit-learn
  - matplotlib
  - xarray
  - netcdf4
  - rioxarray
  - rasterio
  - dask
  - joblib
  - numba
  - optuna
  - pytest
  - pip:
      # CUDA 12.8 build: required for RTX 50-series (Blackwell) GPUs, and also
      # runs on CPU-only PCs.
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch>=2.7
      - earthaccess
      - -e .
